name: OpenShell Focused Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openshell:
    name: OpenShell bubblewrap regression
    # OpenShell requires an enabled Landlock LSM, absent on the Blacksmith kernel.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: integration-qa-pr
    env:
      NODE_BASE_IMAGE: ${{ vars.CONTAINER_NODE_BASE_IMAGE }}
      CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
      OCC_TEST_OPENAI_MODEL: ${{ vars.OCC_TEST_OPENAI_MODEL }}
    steps:
      - name: Verify Landlock support
        run: |
          python3 - <<'PYTHON'
          import ctypes
          import os
          import platform

          assert platform.machine() == "x86_64", "This probe requires the x86_64 runner."
          # x86_64 __NR_landlock_create_ruleset, LANDLOCK_CREATE_RULESET_VERSION.
          libc = ctypes.CDLL(None, use_errno=True)
          abi = libc.syscall(444, 0, 0, 1)
          if abi < 3:
              raise SystemExit(f"OpenShell requires Landlock ABI >=3; got {abi}, errno={ctypes.get_errno()}")
          print(f"Kernel {os.uname().release}: Landlock ABI {abi}")
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: openshell
          profile: full
          node-version: "24.16.0"
          artifact-prefix: qa-advisory
          job-timeout-minutes: 120
